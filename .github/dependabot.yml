# Keep the SHA-pinned workflow actions current, like the product repos.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One PR for all action bumps, so they merge (and deploy) together; separate
    # PRs also queue behind Dependabot's five-open-PR limit.
    groups:
      github-actions:
        patterns: ["*"]
