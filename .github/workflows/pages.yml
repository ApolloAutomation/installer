name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight production deploy finish; a newer push queues behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Network-free gate: a malformed registry (duplicate id, missing image,
      # manifest outside its repo's Pages site) never reaches production, even
      # when a PR merged with red or stale checks.
      - name: Check registry (offline)
        run: |
          python scripts/test_validate_registry.py
          python scripts/validate_registry.py --offline
      - name: Stage site files
        run: |
          mkdir _site
          cp -r index.html css js images assets vendor devices.json _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
