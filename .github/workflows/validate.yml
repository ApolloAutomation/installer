name: Validate

on:
  pull_request:
  push:
    branches: [main]   # test the merged result, not just the PR head
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"   # nightly registry check

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # the nightly opens an issue when upstream firmware breaks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validator unit tests (offline)
        run: python scripts/test_validate_registry.py
      - name: Image script unit tests (offline)
        run: python scripts/test_fetch_images.py
      - name: Registry checks (offline)
        run: python scripts/validate_registry.py --offline
      - name: Registry checks (live manifests, configs and installers)
        shell: bash
        run: python scripts/validate_registry.py 2>&1 | tee validate.log
      # Nightly failures otherwise only email whoever last edited the cron line.
      - name: Report nightly failure
        if: failure() && github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly registry check failed"
          log=$(tail -n 40 validate.log 2>/dev/null)
          body=$(printf 'The nightly registry check failed: %s\n\n```\n%s\n```\n' "$RUN_URL" "${log:-No validator output; an earlier step failed. See the run.}")
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  ui-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: tests/test-results/
          retention-days: 14
